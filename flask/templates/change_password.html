{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2 class="page-title mb-4">
        <i class="bi bi-key-fill me-2"></i>
        Change Password
    </h2>

    <div class="profile-card">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">
                    Current Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="current_password"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">
                    New Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="new_password"
                    required>
            </div>

            <div class="mb-4">
                <label class="form-label">
                    Confirm Password
                </label>

                <input
                    type="password"
                    class="form-control"
                    name="confirm_password"
                    required>
            </div>

            <button class="btn btn-primary">
                <i class="bi bi-check-circle-fill me-2"></i>
                Update Password
            </button>

        </form>

    </div>

</div>

{% endblock %}
